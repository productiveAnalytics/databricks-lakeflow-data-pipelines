            python_file: ../dqx/scripts/run_dqx.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --implementation
              - type1_python
              - --layer
              - bronze
              - --table
              - ${var.catalog}.${resources.schemas.bronze_type1_python.name}.customer_cdc
        - task_key: silver
